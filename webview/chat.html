  <style>
    @layer theme, base, components, utilities;

    :root {
      --startup-background: #050505;
      --cy-color: #ffffff;
      --cy-accent: #e0e0e0;
      --cy-glow: rgba(255, 255, 255, 0.2);
      --cy-accent-glow: rgba(224, 224, 224, 0.15);
      --surface: #0a0a0a;
      --surface-hover: #141414;
      --surface-border: rgba(255, 255, 255, 0.1);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.6);
      --border: rgba(255, 255, 255, 0.14);
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--startup-background);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      color: var(--text-primary);
      overflow: hidden;
    }

    body {
      outline: none;
    }

    #root {
      width: 100%;
      height: 100%;
    }

    /* --- Animated cyberpunk background --- */
    .cy-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse at center, #080808 0%, #050505 100%);
      overflow: hidden;
    }

    .cy-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 15% 25%, rgba(0, 255, 136, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(0, 212, 255, 0.05) 0%, transparent 35%),
        radial-gradient(circle at 50% 50%, rgba(138, 0, 255, 0.03) 0%, transparent 60%);
      animation: bgShift 12s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .cy-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 255, 136, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 136, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      animation: gridMove 20s linear infinite;
      pointer-events: none;
    }

    .cy-grid::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.3) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.3) 1px, transparent 1px);
      background-size: 8px 8px;
      opacity: 0.3;
      pointer-events: none;
    }

    .cy-scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom,
          rgba(0, 0, 0, 0.03) 1px,
          transparent 1px,
          transparent 2px,
          rgba(0, 255, 136, 0.01) 2px);
      background-size: 100% 4px;
      animation: scanMove 4s linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    .cy-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .cy-particle {
      position: absolute;
      background: var(--cy-color);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
      pointer-events: none;
    }

    .cy-data-stream {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--cy-color), transparent);
      opacity: 0.15;
      animation: dataStreamMove 6s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes bgShift {
      0% {
        opacity: 0.8;
        filter: hue-rotate(0deg) brightness(1);
      }

      100% {
        opacity: 1;
        filter: hue-rotate(15deg) brightness(1.05);
      }
    }

    @keyframes gridMove {
      0% {
        background-position: 0 0;
      }

      100% {
        background-position: 1000px 1000px;
      }
    }

    @keyframes scanMove {
      0% {
        background-position: 0 0;
      }

      100% {
        background-position: 0 32px;
      }
    }

    @keyframes dataStreamMove {
      0% {
        transform: translateY(-100%);
        opacity: 0;
      }

      5% {
        opacity: 0.3;
      }

      50% {
        opacity: 0.5;
      }

      95% {
        opacity: 0.2;
      }

      100% {
        transform: translateY(100vh);
        opacity: 0;
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.2;
        transform: scale(0.8);
      }

      50% {
        opacity: 0.8;
        transform: scale(1.2);
      }
    }

    /* --- Startup loader content (centered) --- */
    .startup-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      z-index: 10;
      flex-direction: column;
    }

    .startup-loader__brand {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 500;
      color: var(--cy-color);
      letter-spacing: 6px;
      text-transform: uppercase;
      font-family: 'SF Mono', 'Fira Code', monospace;
      animation: fadeIn 0.8s ease-out;
      text-shadow: 0 0 8px var(--cy-glow);
      z-index: 11;
    }

    .startup-loader__content {
      position: relative;
      z-index: 11;
      text-align: center;
      margin-top: 24px;
    }

    .startup-loader__logo {
      font-size: 56px;
      font-weight: 800;
      color: var(--cy-color);
      letter-spacing: 12px;
      text-transform: uppercase;
      font-family: 'SF Mono', 'Fira Code', monospace;
      animation: fadeIn 0.8s ease-out;
      text-shadow: 0 0 24px var(--cy-glow), 0 0 48px var(--cy-glow), 0 0 80px var(--cy-accent-glow);
      margin-bottom: 6px;
    }

    .startup-loader__subtitle {
      font-size: 13px;
      color: var(--cy-accent);
      letter-spacing: 4px;
      text-transform: uppercase;
      font-family: 'SF Mono', 'Fira Code', monospace;
      animation: fadeIn 1.2s ease-out;
      margin-bottom: 28px;
      text-shadow: 0 0 8px rgba(0, 212, 255, 0.3);
    }

    .startup-loader__cyber {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      position: relative;
      animation: cyberPulse 2.5s ease-in-out infinite;
    }

    .startup-loader__cyber::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 2px solid var(--cy-color);
      border-radius: 8px;
      animation: cyberRotate 5s linear infinite, cyberGlowPulse 3s ease-in-out infinite;
      box-shadow: 0 0 30px var(--cy-glow), inset 0 0 30px var(--cy-glow), 0 0 60px var(--cy-accent-glow);
    }

    .startup-loader__cyber::after {
      content: 'CY';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      color: var(--cy-color);
      letter-spacing: 5px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      text-shadow: 0 0 12px var(--cy-glow);
    }

    .startup-loader__continue {
      position: relative;
      z-index: 11;
      margin-top: 4px;
      padding: 12px 32px;
      background: rgba(0, 255, 136, 0.08);
      border: 1px solid var(--cy-color);
      border-radius: 6px;
      color: var(--cy-color);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
      animation: fadeIn 1.6s ease-out;
      font-family: 'SF Mono', 'Fira Code', monospace;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px var(--cy-glow);
    }

    .startup-loader__continue:hover {
      background: rgba(0, 255, 136, 0.2);
      box-shadow: 0 0 30px var(--cy-glow), 0 0 40px var(--cy-accent-glow);
      transform: translateY(-2px);
      border-color: var(--cy-accent);
      color: var(--cy-accent);
    }

    .startup-loader__google {
      position: relative;
      z-index: 11;
      margin-top: 12px;
      padding: 10px 26px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      animation: fadeIn 1.8s ease-out;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .startup-loader__google:hover {
      background: rgba(0, 255, 136, 0.08);
      border-color: var(--cy-color);
      color: var(--cy-color);
      box-shadow: 0 0 15px var(--cy-glow);
      transform: translateY(-2px);
    }

    .startup-loader__tagline {
      font-size: 10px;
      color: var(--text-secondary);
      letter-spacing: 8px;
      text-transform: uppercase;
      font-family: 'SF Mono', 'Fira Code', monospace;
      margin-top: 10px;
      animation: fadeIn 2s ease-out;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.1);
    }

    .cy-loading-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, #080808 0%, #050505 100%);
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
    }

    .cy-loading-overlay__logo {
      font-size: 56px;
      font-weight: 800;
      color: var(--cy-color);
      letter-spacing: 12px;
      text-transform: uppercase;
      font-family: 'SF Mono', 'Fira Code', monospace;
      text-shadow: 0 0 24px var(--cy-glow), 0 0 48px var(--cy-glow), 0 0 80px var(--cy-accent-glow);
      margin-bottom: 8px;
      animation: logoGlow 2s ease-in-out infinite alternate;
    }

    .cy-loading-overlay__subtitle {
      font-size: 12px;
      color: var(--cy-accent);
      letter-spacing: 4px;
      text-transform: uppercase;
      font-family: 'SF Mono', 'Fira Code', monospace;
      margin-bottom: 24px;
      text-shadow: 0 0 8px rgba(0, 212, 255, 0.3);
    }

    .cy-loading-overlay__progress {
      width: 280px;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .cy-loading-overlay__progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cy-color), var(--cy-accent));
      border-radius: 3px;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px var(--cy-glow);
    }

    .cy-loading-overlay__percent {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      font-size: 11px;
      color: var(--text-secondary);
      font-family: monospace;
      letter-spacing: 1px;
    }

    .cy-loading-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, #080808 0%, #050505 100%);
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
      backdrop-filter: blur(20px);
    }

    .cy-loading-overlay__logo {
      font-size: 48px;
      font-weight: 800;
      color: var(--cy-color);
      letter-spacing: 12px;
      text-transform: uppercase;
      font-family: 'SF Mono', 'Fira Code', monospace;
      text-shadow: 0 0 24px var(--cy-glow), 0 0 48px var(--cy-glow);
      margin-bottom: 8px;
    }

    .cy-loading-overlay__subtitle {
      font-size: 11px;
      color: var(--text-secondary);
      letter-spacing: 4px;
      text-transform: uppercase;
      font-family: 'SF Mono', 'Fira Code', monospace;
      margin-bottom: 24px;
    }

    .cy-loading-overlay__progress {
      width: 280px;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .cy-loading-overlay__progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cy-color), #00d4ff);
      border-radius: 3px;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px var(--cy-glow);
    }

    .cy-loading-overlay__percent {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      font-size: 11px;
      color: var(--text-secondary);
      font-family: monospace;
      letter-spacing: 1px;
    }

    .startup-loader__dots {
      display: flex;
      gap: 5px;
      margin-top: 8px;
      justify-content: center;
    }

    .startup-loader__dot {
      width: 5px;
      height: 5px;
      background: var(--cy-color);
      border-radius: 50%;
      animation: dotPulse 1.4s ease-in-out infinite;
      box-shadow: 0 0 8px var(--cy-glow);
    }

    .startup-loader__dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .startup-loader__dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.4;
      }

      50% {
        transform: scale(1.15);
        opacity: 0.7;
      }
    }

    @keyframes cyberPulse {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 0 30px var(--cy-glow), inset 0 0 30px var(--cy-glow);
      }

      50% {
        transform: scale(1.05);
        box-shadow: 0 0 50px var(--cy-glow), inset 0 0 50px var(--cy-accent-glow);
      }
    }

    @keyframes cyberRotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes cyberGlowPulse {

      0%,
      100% {
        box-shadow: 0 0 30px var(--cy-glow), inset 0 0 30px var(--cy-glow);
      }

      50% {
        box-shadow: 0 0 50px var(--cy-accent-glow), inset 0 0 50px var(--cy-accent-glow);
      }
    }

    @keyframes logoGlow {
      0% {
        text-shadow: 0 0 24px var(--cy-glow), 0 0 48px var(--cy-glow), 0 0 80px var(--cy-accent-glow);
      }

      100% {
        text-shadow: 0 0 48px var(--cy-glow), 0 0 80px var(--cy-glow), 0 0 120px var(--cy-accent-glow);
      }
    }

    @keyframes dotPulse {

      0%,
      100% {
        opacity: 0.3;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
        box-shadow: 0 0 12px var(--cy-glow);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .startup-loader__logo,
      .startup-loader__subtitle,
      .startup-loader__brand,
      .startup-loader__continue,
      .startup-loader__google,
      .startup-loader__tagline {
        animation: none;
      }

      .startup-loader::before,
      .startup-loader__cyber::before {
        animation: none;
      }

      .startup-loader__dot {
        animation: none;
        opacity: 0.6;
      }
    }

      justify-content: center;
      gap: 14px;
      height: 46px;
      background: linear-gradient(90deg, #8a0d0d, #d11a1a, #8a0d0d);
      border-bottom: 3px solid #ff5050;
      box-shadow: 0 4px 18px rgba(255, 0, 0, 0.55);
      font-family: 'SF Mono', 'Fira Code', monospace;
      pointer-events: none;
    }

    .cy-version-banner__label {
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ffd6d6;
      font-weight: 700;
    }

    .cy-version-banner__num {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 0 0 14px rgba(255, 80, 80, 0.9);
    }
  </style>
</head>

<body tabindex="0" style="outline: none">
  <div class="cy-version-banner" id="cy-version-banner">
    <span class="cy-version-banner__label">CY</span>
    <span class="cy-version-banner__num">v1.8.65</span>
  </div>
  <div id="root">
    <div class="cy-bg">
      <div class="cy-grid"></div>
      <div class="cy-scanlines"></div>
      <div class="cy-particles" id="cy-particles"></div>
      <div class="cy-data-streams" id="cy-data-streams"></div>
    </div>
    <!-- Hidden loader for extension initialization -->
    <div class="cy-loading-overlay" id="cy-loading-overlay" style="display: none;">
      <div class="cy-loading-overlay__logo">CY</div>
      <div class="cy-loading-overlay__subtitle">Initializing</div>
      <div class="cy-loading-overlay__progress">
        <div class="cy-loading-overlay__progress-bar" id="cy-progress-bar"></div>
        <span class="cy-loading-overlay__percent" id="cy-progress-percent">0%</span>
      </div>
    </div>
  </div>
  <script>
    // Handle messages from iframe (api-connection.html)
    window.addEventListener('message', (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'cy-api-key-ready' && data.apiKey) {
          localStorage.setItem('cy.apiKey', data.apiKey);
          const loader = document.getElementById('cy-loading-overlay');
          if (loader) {
            loader.style.display = 'flex';
          }
        }
      } catch (e) {
        // Ignore non-JSON messages
      }
    });

    (function () {
      function createParticles(container, count) {
        for (let i = 0; i < count; i++) {
          const p = document.createElement('div');
          p.className = 'cy-particle';
          const size = Math.random() * 3 + 1;
          p.style.width = size + 'px';
          p.style.height = size + 'px';
          const posX = Math.random() * 100;
          const posY = Math.random() * 100;
          p.style.left = posX + 'vw';
          p.style.top = posY + 'vh';
          p.style.animationDelay = (Math.random() * 3) + 's';
          p.style.animationDuration = (2 + Math.random() * 2) + 's';
          const colors = ['#ff3030', '#ff6a3d', '#ff0000'];
          p.style.background = colors[Math.floor(Math.random() * colors.length)];
          p.style.boxShadow = '0 0 ' + (8 + Math.random() * 12) + 'px ' + p.style.background;
          container.appendChild(p);
        }
      }

      function createDataStreams(container, count) {
        for (let i = 0; i < count; i++) {
          const s = document.createElement('div');
          s.className = 'cy-data-stream';
          s.style.left = (10 + i * 12) + 'vw';
          s.style.animationDelay = (i * 1.5) + 's';
          container.appendChild(s);
        }
      }

      const particles = document.getElementById('cy-particles');
      const streams = document.getElementById('cy-data-streams');
      if (particles) createParticles(particles, 60);
      if (streams) createDataStreams(streams, 6);
    })();
  </script>
</body>

</html>
