<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect to Symbiotyc</title>
  <style>
    :root {
      --bg: #050505;
      --surface: #0a0a0a;
      --surface-hover: #141414;
      --border: rgba(255, 255, 255, 0.1);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.6);
      --accent: #ffffff;
      --accent-hover: #e0e0e0;
      --accent-glow: rgba(255, 255, 255, 0.2);
      --error: #ff4444;
      --success: #00ff88;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      height: 100%;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 0 40px var(--accent-glow);
    }

    .logo {
      font-size: 48px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 12px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      text-align: center;
      margin-bottom: 8px;
      text-shadow: 0 0 24px var(--accent-glow);
    }

    .title {
      font-size: 14px;
      color: var(--text-secondary);
      letter-spacing: 4px;
      text-transform: uppercase;
      font-family: 'SF Mono', 'Fira Code', monospace;
      text-align: center;
      margin-bottom: 32px;
    }

    .description {
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .label {
      display: block;
      font-size: 11px;
      color: var(--text-secondary);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 13px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      outline: none;
      transition: all 0.2s ease;
    }

    .input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 16px var(--accent-glow);
      background: rgba(255, 255, 255, 0.08);
    }

    .input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 2px;
      cursor: pointer;
      font-family: 'SF Mono', 'Fira Code', monospace;
      text-transform: uppercase;
      transition: all 0.2s ease;
      margin-top: 16px;
    }

    .btn:hover {
      background: var(--accent-hover);
      box-shadow: 0 0 24px var(--accent-glow);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 16px;
      font-size: 13px;
      text-align: center;
      font-family: 'SF Mono', 'Fira Code', monospace;
      min-height: 20px;
    }

    .status.error {
      color: var(--error);
    }

    .status.success {
      color: var(--success);
    }

    .footer {
      margin-top: 32px;
      text-align: center;
    }

    .footer-text {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .footer-text a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 24px 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }

    .divider span {
      padding: 0 12px;
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .google-signin-btn {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .google-signin-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent);
    }

    .google-icon {
      width: 18px;
      height: 18px;
    }

    .hidden {
      display: none !important;
    }

    .api-key-note {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 8px;
      text-align: center;
    }

    .api-key-note a {
      color: var(--accent);
      text-decoration: none;
    }

    .api-key-note a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <div class="logo">CY</div>
      <div class="title">Connect to Symbiotyc</div>

      <div class="description">
        Connect to Symbiotyc CY using your API key. Your key is stored securely and used only for authentication.
      </div>

      <div id="api-form">
        <div class="form-group">
          <label class="label" for="api-key">CY API Key</label>
          <input type="password" id="api-key" class="input" placeholder="cfat_..." autocomplete="off" />
          <div class="api-key-note">
            Don't have an API key?
            <a href="https://cy.symbiotyc.worker.dev" target="_blank" rel="noopener noreferrer">
              Get one at cy.symbiotyc.worker.dev
            </a>
          </div>
        </div>

        <button id="connect-btn" class="btn">Connect to Symbiotyc</button>
        <div class="status" id="status"></div>
      </div>

      <div class="divider">
        <span>or</span>
      </div>

      <a href="https://platform.symbiotyc.workers.dev/api-keys" target="_blank" rel="noopener noreferrer"
        class="google-signin-btn">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" />
          <path fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
          <path fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
        </svg>
        Sign in with Google
      </a>

      <div class="footer">
        <div class="footer-text">
          By connecting, you agree to our <a href="https://symbiotyc.workers.dev/policies/row-terms-of-use/"
            target="_blank" rel="noopener noreferrer">Terms of Service</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_KEY_STORAGE_KEY = 'cy.apiKey';

    // Handle messages from iframe (api-connection.html)
    window.addEventListener('message', (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'cy-api-key-ready' && data.apiKey) {
          // Store API key in localStorage
          localStorage.setItem(API_KEY_STORAGE_KEY, data.apiKey);
          // Show loading overlay briefly
          const loader = document.getElementById('cy-loading-overlay');
          if (loader) {
            loader.style.display = 'flex';
          }
          // Redirect to chat after 1 second
          setTimeout(() => {
            window.location.href = './chat.html';
          }, 1500);
        }
      } catch (e) {
        // Ignore non-JSON messages
      }
    });

    // Connect to Symbiotyc using API key
    async function connectWithApiKey() {
      const connectBtn = document.getElementById('connect-btn');
      const statusEl = document.getElementById('status');
      const apiKeyInput = document.getElementById('api-key');

      // Disable button
      connectBtn.disabled = true;
      statusEl.textContent = 'Connecting...';
      statusEl.className = 'status';

      try {
        const apiKey = apiKeyInput.value.trim();

        if (!apiKey || apiKey.length === 0) {
          throw new Error('Please enter your API key');
        }

        // Store API key
        localStorage.setItem(API_KEY_STORAGE_KEY, apiKey);

        // Signal the extension to switch to chat view
        window.parent.postMessage(JSON.stringify({
          type: 'cy-api-key-ready',
          apiKey: apiKey,
          redirect: true
        }), '*');

        // Show success message
        statusEl.innerHTML =
          `<div style="color: var(--success); font-family: 'SF Mono', monospace; letter-spacing: 2px;">
            <div style="margin-bottom: 8px; font-size: 13px;">Connected!</div>
            <div style="margin-top: 12px; font-size: 12px;">Returning to CY...</div>
          </div>`;
        statusEl.className = 'status success';

      } catch (e) {
        statusEl.textContent = e.message || 'Connection failed';
        statusEl.className = 'status error';
        connectBtn.disabled = false;
      }
    }

    // Bind connect button
    document.getElementById('connect-btn')?.addEventListener('click', connectWithApiKey);
  </script>
</body>

</html>
