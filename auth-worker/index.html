<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CY Connect</title>
<style>
  :root {
    --bg: #050505;
    --surface: #0a0a0a;
    --text: #ffffff;
    --text-secondary: rgba(255,255,255,0.6);
    --border: rgba(255,255,255,0.1);
    --accent: #ffffff;
    --glow: rgba(255,255,255,0.15);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 0 40px var(--glow);
  }
  .logo {
    font-size: 48px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 12px;
    text-align: center;
    margin-bottom: 8px;
    text-shadow: 0 0 20px var(--glow);
  }
  .title {
    font-size: 12px;
    color: var(--text-secondary);
    letter-spacing: 4px;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 28px;
    font-family: monospace;
  }
  .input {
    width: 100%;
    padding: 14px 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    margin-bottom: 16px;
    font-family: monospace;
  }
  .input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--glow);
  }
  .btn {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #050505;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 2px;
    cursor: pointer;
    font-family: monospace;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .btn:hover {
    box-shadow: 0 0 20px var(--glow);
    transform: translateY(-2px);
  }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }
  .status {
    margin-top: 16px;
    font-size: 12px;
    font-family: monospace;
    color: var(--text-secondary);
    min-height: 16px;
    text-align: center;
  }
  .status.error { color: #ff4444; }
  .status.success { color: #00ff88; }
  .key-box {
    margin-top: 16px;
    padding: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: monospace;
    font-size: 11px;
    word-break: break-all;
    color: var(--text-secondary);
    display: none;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">CY</div>
    <div class="title">Connect</div>

    <div id="step-email">
      <input type="email" id="email" class="input" placeholder="you@email.com" autocomplete="email">
      <button class="btn" id="connect-btn">Connect CY</button>
      <div class="status" id="status"></div>
    </div>

    <div id="step-key" class="hidden">
      <div class="status success" style="margin-bottom:12px;">Connected!</div>
      <div class="key-box" id="key-box"></div>
      <button class="btn btn-secondary" id="copy-btn" style="margin-top:12px;">Copy API Key</button>
      <div class="status" id="key-status"></div>
    </div>
  </div>

<script>
const API_BASE = location.origin;
const emailInput = document.getElementById('email');
const connectBtn = document.getElementById('connect-btn');
const statusEl = document.getElementById('status');
const stepEmail = document.getElementById('step-email');
const stepKey = document.getElementById('step-key');
const keyBox = document.getElementById('key-box');
const copyBtn = document.getElementById('copy-btn');
const keyStatus = document.getElementById('key-status');

function setStatus(el, msg, type = '') {
  el.textContent = msg;
  el.className = 'status' + (type ? ' ' + type : '');
}

connectBtn.addEventListener('click', async () => {
  const email = emailInput.value.trim();
  if (!email || !email.includes('@')) {
    setStatus(statusEl, 'Enter a valid email', 'error');
    return;
  }
  connectBtn.disabled = true;
  setStatus(statusEl, 'Connecting...', '');
  try {
    const res = await fetch(API_BASE + '/api/auth/key', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || 'Failed');
    const apiKey = data.user?.apiKey;
    if (!apiKey) throw new Error('No API key returned');
    stepEmail.classList.add('hidden');
    stepKey.classList.remove('hidden');
    keyBox.textContent = apiKey;
    setStatus(keyStatus, 'Save this key in CY: Settings → API Key', 'success');
  } catch (e) {
    setStatus(statusEl, e.message, 'error');
    connectBtn.disabled = false;
  }
});

copyBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(keyBox.textContent);
    setStatus(keyStatus, 'Copied to clipboard', 'success');
  } catch {
    setStatus(keyStatus, 'Copy failed', 'error');
  }
});
</script>
</body>
</html>
